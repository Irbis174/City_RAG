[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "irbis174", email = "matvey.golovkin@mail.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "shared",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.sources]
shared = { path = "../shared", editable = true }
